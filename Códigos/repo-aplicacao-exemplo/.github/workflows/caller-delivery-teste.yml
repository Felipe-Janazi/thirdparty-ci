# ============================================================
# WORKFLOW CALLER - VERSAO DE TESTE (sem Orca, sem deploy/Nexus)
# ============================================================
# Use este caller enquanto estiver validando somente o bloqueio
# do Dockerfile. Ele chama "reusable-delivery-pipeline-teste.yml"
# em vez da versao completa.
#
# Quando a validacao do bloqueio estiver confirmada, e so trocar:
#   reusable-delivery-pipeline-teste.yml  ->  reusable-delivery-pipeline.yml
# e adicionar o secret ORCA_API_TOKEN. Nao precisa mudar mais nada.
# ============================================================

name: CI - Delivery (Teste de Bloqueio)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  delivery:
    uses: B3/repo-central-workflows/.github/workflows/reusable-delivery-pipeline-teste.yml@main
    with:
      artifact-path: artifacts/app.jar
      nexus-artifact-url: https://nexus.b3.internal/repository/releases-raw/com/b3/app/app.jar
      max-size-mb: 50
      runner-label: sncd-dev
      image-name: minha-app
    secrets:
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
