# ============================================================
# WORKFLOW CALLER - fica no repositorio da APLICACAO
# ============================================================
# Esse arquivo NAO tem a logica de validacao/build/scan.
# Ele so aciona o workflow reutilizavel que mora no repositorio
# principal de workflows, passando os parametros especificos
# desse repositorio (path do artefato, nome da imagem, etc).
#
# IMPORTANTE: troque "B3/repo-central-workflows" abaixo pelo
# nome real do repositorio principal de workflows de voces.
# ============================================================

name: CI - Delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  delivery:
    # <organizacao>/<repo-principal>/.github/workflows/<arquivo>.yml@<branch-ou-tag>
    uses: B3/repo-central-workflows/.github/workflows/reusable-delivery-pipeline.yml@main
    with:
      artifact-path: artifacts/app.jar
      nexus-artifact-url: https://nexus.b3.internal/repository/releases-raw/com/b3/app/app.jar
      max-size-mb: 50
      runner-label: sncd-dev
      image-name: minha-app
      orca-fail-on: critical,high
    secrets:
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
      ORCA_API_TOKEN: ${{ secrets.ORCA_API_TOKEN }}
